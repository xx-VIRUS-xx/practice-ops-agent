version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # NOTE: for real patient data this named volume should sit on an
      # encrypted disk/filesystem (e.g. LUKS on Linux, encrypted EBS/managed
      # disk in cloud). See README "GDPR & Health Data Handling" for details.
      - qdrant_data:/qdrant/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: practice_ops
      POSTGRES_PASSWORD: practice_ops_dev_password
      POSTGRES_DB: practice_ops
    ports:
      - "5432:5432"
    volumes:
      # Same encrypted-volume note applies here for production deployments.
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://practice_ops:practice_ops_dev_password@db:5432/practice_ops
      QDRANT_URL: http://qdrant:6333
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-REPLACE_ME_WITH_A_GENERATED_FERNET_KEY_BASE64==}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:-dev-admin-bootstrap-key-change-me}
    depends_on:
      - qdrant
      - db

volumes:
  qdrant_data:
  postgres_data:
